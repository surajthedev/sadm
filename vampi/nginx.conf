# Gateway in front of VAmPI. Logs one JSON object per request.
# Only a boolean is recorded for auth: the Authorization value itself is never written.
# $uri has no query string, and request bodies are not logged.
map $http_authorization $has_auth {
    default true;
    ""      false;
}

log_format sadm escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"has_auth":$has_auth}';

server {
    listen 80;
    access_log /var/log/sadm/access.jsonl sadm;

    location / {
        proxy_pass http://vampi:5000;
    }
}
