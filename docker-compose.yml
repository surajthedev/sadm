# VAmPI is deliberately vulnerable: it has no published port, and the gateway
# listens on 127.0.0.1 only. Run `docker compose down` when finished.
services:
  vampi:
    image: erev0s/vampi:latest
    environment:
      vulnerable: "${VULNERABLE:-1}"

  gateway:
    image: nginx:alpine
    depends_on: [vampi]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./vampi/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/sadm
